services:
  - type: web
    name: microgrid-forecaster-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./microgrid.db
      - key: PROJECT_NAME
        value: "AI-Driven Micro-Grid Renewable Energy Load Forecaster"
      - key: CORS_ORIGINS
        value: "*"
